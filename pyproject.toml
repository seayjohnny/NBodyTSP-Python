[project]
name = "nbodytsp-python"
version = "0.2.0"
description = "N-Body TSP Simulator with composable physics engine and web UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
cuda13 = [
    "cupy-cuda13x>=13.6.0",
]
cuda12 = [
    "cupy-cuda12x>=13.6.0",
]
cuda11 = [
    "cupy-cuda11x>=13.6.0",
]

[project.scripts]
nbodytsp = "tsp_nbody.server:main"

[tool.setuptools]
packages = ["tsp_nbody", "tsp_nbody.kernels"]
